<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contador interactivo para registrar eventos del Colegio Bolívar.">

    <title>Contador de Eventos | Colegio Bolívar</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>
    <main class="contenedor">

        <span class="etiqueta">Colegio Bolívar</span>

        <h1 id="tituloEvento">Contador de Eventos</h1>

        <p class="descripcion">
            Registra y lleva el control de tus eventos escolares.
        </p>

        <div class="campo-titulo">
            <label for="nuevoTitulo">Nombre del evento</label>

            <input
                type="text"
                id="nuevoTitulo"
                placeholder="Escribe el nombre del evento..."
                maxlength="80"
                autocomplete="off"
            >
        </div>

        <section class="contador-caja" aria-label="Contador de eventos">
            <div id="contador" aria-live="polite">0</div>

            <p class="contador-titulo">Eventos registrados</p>
        </section>

        <div class="botones">
            <button type="button" id="botonClick">
                + Registrar evento
            </button>

            <button type="button" id="botonReiniciar">
                Reiniciar Contador
            </button>
        </div>

        <p class="pie">
            COLEGIO BOLÍVAR · EVENTOS ESCOLARES
        </p>

    </main>
</body>
</html>
