<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Eventos | Colegio Bolívar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #050b1e, #0b1533, #101f42);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            background: rgba(15, 27, 55, 0.95);
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
            text-align: center;
            border-radius: 20px;
            border: 1px solid rgba(0, 245, 255, 0.25);
            box-shadow: 0 0 35px rgba(0, 245, 255, 0.08);
        }

        .etiqueta {
            display: inline-block;
            color: #00f5ff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .descripcion {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .campo-titulo {
            text-align: left;
            margin-bottom: 25px;
        }

        .campo-titulo label {
            display: block;
            color: #00f5ff;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .campo-titulo input {
            width: 100%;
            padding: 13px;
            background: #081329;
            color: #ffffff;
            border: 1px solid #263b5e;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .campo-titulo input:focus {
            border-color: #00f5ff;
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.2);
        }

        .contador-caja {
            background: #081329;
            border: 1px solid rgba(0, 245, 255, 0.25);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        #contador {
            font-size: 80px;
            font-weight: 800;
            color: #00f5ff;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            transition: transform 0.2s ease;
        }

        .contador-titulo {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        #botonClick {
            background: #00f5ff;
            color: #061225;
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.3);
        }

        #botonClick:hover {
            background: #70fbff;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.6);
            transform: translateY(-2px);
        }

        #botonReiniciar {
            background: transparent;
            color: #ff4d8d;
            border: 1px solid #ff4d8d;
        }

        #botonReiniciar:hover {
            background: rgba(255, 77, 141, 0.12);
            box-shadow: 0 0 15px rgba(255, 77, 141, 0.25);
        }

        .pie {
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .contenedor {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            #contador {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <span class="etiqueta">Colegio Bolívar</span>

        <h1 id="tituloEvento">Contador de Eventos</h1>

        <p class="descripcion">
            Registra y lleva el control de tus eventos escolares.
        </p>

        <div class="campo-titulo">
            <label for="nuevoTitulo">Nombre del evento</label>

            <input
                type="text"
                id="nuevoTitulo"
                placeholder="Escribe el nombre del evento..."
                maxlength="80"
                autocomplete="off"
            >
        </div>

        <section class="contador-caja">
            <div id="contador" aria-live="polite">0</div>

            <p class="contador-titulo">Eventos registrados</p>
        </section>

        <div class="botones">

            <button id="botonClick" onclick="incrementarContador()">
                + Registrar evento
            </button>

            <button id="botonReiniciar" onclick="reiniciarContador()">
                Reiniciar Contador
            </button>

        </div>

        <p class="pie">
            COLEGIO BOLÍVAR · EVENTOS ESCOLARES
        </p>

    </main>

    <script>
        let clicks = 0;

        const contador = document.getElementById("contador");
        const tituloEvento = document.getElementById("tituloEvento");
        const campoTitulo = document.getElementById("nuevoTitulo");

        // Incrementar el contador
        function incrementarContador() {
            clicks++;
            actualizarContador();
        }

        // Reiniciar el contador a cero
        function reiniciarContador() {
            clicks = 0;
            actualizarContador();
        }

        // Actualizar el número mostrado
        function actualizarContador() {
            contador.textContent = clicks;

            contador.style.transform = "scale(1.12)";

            setTimeout(() => {
                contador.style.transform = "scale(1)";
            }, 150);
        }

        // Cambiar el título mientras el usuario escribe
        campoTitulo.addEventListener("input", function () {
            const texto = campoTitulo.value.trim();

            tituloEvento.textContent = texto || "Contador de Eventos";
        });
    </script>

</body>
</html>
